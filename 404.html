<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Page not found | Subash Saajan J</title>
<style>
  :root { --ink: #17191c; --muted: #545b63; --paper: #f7f8fa; --link: #0f7a63; --link-hover: #12a081; color-scheme: only light; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Charter', 'Georgia', 'Cambria', 'Times New Roman', serif; font-size: 18px; line-height: 1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 96px 28px 80px; }
  h1 { font-size: 30px; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 14px; }
  a { color: var(--link); }
  a:hover { color: var(--link-hover); }
  @media (max-width: 400px) { .wrap { padding: 64px 16px 56px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Page not found</h1>
  <p>There's nothing at this address.</p>
  <p><a href="/">Go to the home page</a></p>
</div>
</body>
</html>
